# 手动触发按钮配置
# 在「代码 - 分支详情页」点击按钮，即可手动触发流水线拉取 GitHub 提交
# 触发的事件（web_trigger_pull_github）需在 .cnb.yml 的 $ 分支下配置对应流水线
branch:
  - buttons:
      - name: 拉取 GitHub 提交
        description: 手动拉取 GitHub 仓库的最新提交到当前分支
        event: web_trigger_pull_github
        groupName: GitHub 同步
        inputs:
          github_repo:
            name: GitHub 仓库地址
            type: input
            required: true
            default: https://github.com/h1s97x/DarkSouls-Tome.git
            placeholder: 例如 https://github.com/h1s97x/DarkSouls-Tome.git
          pull_branch:
            name: 拉取目标分支
            type: input
            required: true
            default: main
            placeholder: 例如 main
